name: Generate Wiki Docs

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gendoc:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the main repository
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2️⃣ Check out the wiki repository into ./wiki
      - name: Check out wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      # 3️⃣ Generate documentation
      - name: Generate documentation
        run: make gendoc

      # 4️⃣ Commit and push changes in ./wiki
      - name: Commit & Push wiki changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "docs: update generated documentation"
          branch: master
          repository: wiki
